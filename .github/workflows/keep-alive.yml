# Pings the deployed app every 3 days so the free Supabase project never pauses.
# Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables).
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 30 "${{ vars.APP_URL }}/api/health"
